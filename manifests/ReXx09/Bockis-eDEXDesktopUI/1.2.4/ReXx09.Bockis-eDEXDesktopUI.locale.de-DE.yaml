Description: |-
  Bockis-eDEX Desktop UI ist eine Windows-Desktop-Oberflaeche mit mehreren Monitoren, HUD-Panels, echtem PowerShell-ConPTY-Terminal, Netzwerk- und Systemanzeigen sowie optionaler Rainmeter-Integration.
